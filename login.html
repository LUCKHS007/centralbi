<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Central BI | Pedreira Sargon</title>

    <link rel="icon" href="img/icons/sargon-icon.ico">

    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="background">

    <div class="overlay"></div>

</div>

<div class="login-container">

    <div class="login-card">

        <div class="logo-area">

            <img
            src="img/logos/logo-sargon.png"
            class="logo-sargon">

            <img
            src="img/logos/logo-powerbi.png"
            class="logo-powerbi">

        </div>

        <h1>

            Central BI

        </h1>

        <p>

            Plataforma Corporativa de Business Intelligence

        </p>

        <form id="loginForm">

            <div class="input-group">

                <i class="fa-solid fa-user"></i>

                <input

                type="text"

                id="usuario"

                placeholder="Usuário"

                autocomplete="off"

                required>

            </div>

            <div class="input-group">

                <i class="fa-solid fa-lock"></i>

                <input

                type="password"

                id="senha"

                placeholder="Senha"

                required>

                <button
                    type="button"
                    class="toggle-senha"
                    data-alvo="senha"
                    aria-label="Mostrar senha">
                    <i class="fa-solid fa-eye"></i>
                </button>

            </div>

            <button

            type="submit"

            class="btn-login">

                <i class="fa-solid fa-right-to-bracket"></i>

                Entrar

            </button>

        </form>

        <form id="formCodigo2fa" hidden>

            <p class="texto-2fa">Digite o código de 6 dígitos do seu aplicativo autenticador.</p>

            <div class="input-group">

                <i class="fa-solid fa-shield-halved"></i>

                <input
                type="text"
                id="codigo2fa"
                placeholder="000000"
                inputmode="numeric"
                autocomplete="one-time-code"
                maxlength="6"
                required>

            </div>

            <button type="submit" class="btn-login">
                <i class="fa-solid fa-right-to-bracket"></i>
                Confirmar
            </button>

            <button type="button" id="botaoVoltarLogin" class="botao-voltar-2fa">
                Voltar
            </button>

        </form>

        <div id="erroLogin"></div>

        <div class="footer-login">

            © 2026 Pedreira Sargon

        </div>

    </div>

</div>

<script src="assets/js/toggle-senha.js"></script>

<script src="assets/js/auth.js"></script>

</body>

</html>
